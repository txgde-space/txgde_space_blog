# 评论暂时关闭：原 Twikoo 地址已指向其他服务；确认新地址后再启用。
info:
  title: Thouの空间
  subtitle: Let's Coding!!!
  author: Thou
  url: https://blog.txgde.space
defaults:
  favicon: /images/avatar.svg
  avatar: /images/avatar.svg
global:
  website_counter:
    url: /js/site-counter.js
  hover:
    scale: true
  open_graph:
    image: /images/wallhaven-wqery6-light.webp
    description: '' # 文章使用自己的 description，其他页面回退到站点描述。
home_banner:
  title: Welcome to Thouの空间
  subtitle:
    text:
      - Coding coding coding!
      - Let us code!
  social_links:
    enable: true
    links:
      - icon: github
        url: https://github.com/txgde-space
      - icon: email
        url: tongxuguang23@icloud.com
    qrs: []
navbar:
  links:
    RSS:
      path: /rss.xml
      icon: fa-regular fa-rss
    Archives:
      path: /archives/
      icon: fa-regular fa-archive
    Tags:
      path: /tags/
      icon: fa-solid fa-tags
    Categories:
      path: /categories/
      icon: fa-solid fa-folder
    我的:
      icon: fa-regular fa-user
      submenus:
        个人主页: https://i.txgde.space
        Github: https://github.com/txgde-space
  search:
    enable: true
    preload: false
home:
  sidebar:
    announcement: 好累😭
  excerpt_length: 200
comment:
